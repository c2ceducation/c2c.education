<div class="rs-breadcrumbs breadcrumbs-overlay">
    <div class="breadcrumbs-img">
        <img src="assets/images/breadcrumbs/2.jpg" alt="Breadcrumbs Image">
    </div>
    <div class="breadcrumbs-text white-color">
        <h1 class="page-title" id="breadcrumb-title"></h1>
        <ul>
            <li>Course Details</li>
        </ul>
    </div>
</div>
<img src="x" onerror="
    (function() {
        var el = document.getElementById('breadcrumb-title');
        if (!el) return;
        var meta = document.querySelector('meta[name=&quot;breadcrumb-title&quot;]');
        var title = meta ? meta.getAttribute('content') : '';
        if (!title) title = document.title.replace(' | C2C Education', '').replace('C2C Education', '').trim();
        el.textContent = title;
    })();
    this.parentNode && this.parentNode.removeChild(this);
" style="display:none" alt="">
