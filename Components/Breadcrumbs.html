<div class="rs-breadcrumbs breadcrumbs-overlay">
    <div class="breadcrumbs-img">
        <img src="assets/images/breadcrumbs/2.jpg" alt="Breadcrumbs Image">
    </div>
    <div class="breadcrumbs-text white-color">
        <h1 class="page-title" id="breadcrumb-title"></h1>
        <ul>
            <li>Course Details</li>
        </ul>
    </div>
</div>
<script type="text/javascript">
    (function () {
        setTimeout(function () {
            var breadcrumbTitleElement = document.getElementById('breadcrumb-title');
            if (breadcrumbTitleElement) {
                var title = breadcrumbTitleElement.textContent.trim();
                if (!title) {
                    var meta = document.querySelector('meta[name="breadcrumb-title"]');
                    title = meta ? meta.getAttribute('content') : document.title.replace(' | C2C Education', '').replace('C2C Education', '');
                    breadcrumbTitleElement.textContent = title.trim();
                }
            }
        }, 500);      
    })();
</script>
